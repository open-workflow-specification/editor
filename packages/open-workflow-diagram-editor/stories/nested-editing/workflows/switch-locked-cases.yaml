document:
  dsl: "1.0.3"
  namespace: examples
  name: switch-locked-cases
  version: "0.1.0"
do:
  - routeOrder:
      switch:
        - electronicOrder:
            when: ${ .orderType == "electronic" }
            then: fulfillElectronic
        - physicalOrder:
            when: ${ .orderType == "physical" }
            then: fulfillPhysical
        - subscriptionOrder:
            when: ${ .orderType == "subscription" }
            then: fulfillSubscription
        - default:
            then: rejectUnknownOrder
  - fulfillElectronic:
      set:
        deliveryMethod: email
        status: queued
      then: exit
  - fulfillPhysical:
      set:
        deliveryMethod: courier
        status: queued
      then: exit
  - fulfillSubscription:
      set:
        deliveryMethod: recurring
        status: active
      then: exit
  - rejectUnknownOrder:
      raise:
        error:
          type: https://example.com/errors/unknown-order-type
          status: 400
          title: Unknown Order Type
