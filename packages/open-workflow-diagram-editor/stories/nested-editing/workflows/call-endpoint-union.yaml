# Nested editing focus: endpoint union — the endpoint field can be a plain string URI
# or a structured object with uri + authentication. Both forms appear here so the
# editor can be tested switching between union variants inside nested do containers.
document:
  dsl: "1.0.3"
  namespace: examples
  name: call-endpoint-union
  version: "0.1.0"
do:
  - prepareRequest:
      set:
        serviceToken: ${ .auth.token }
        inputData: ${ .payload }
  - callServices:
      do:
        - callPublicApi:
            call: http
            with:
              method: get
              endpoint: https://public.api.example.com/catalogue
              query:
                category: ${ .category }
        - callSecureApi:
            call: http
            with:
              method: post
              endpoint:
                uri: https://secure.api.example.com/process
                authentication:
                  bearer:
                    token: ${ .serviceToken }
              body:
                payload: ${ .inputData }
        - callOAuthApi:
            call: http
            with:
              method: get
              endpoint:
                uri: https://oauth.api.example.com/data
                authentication:
                  oauth2:
                    authority: https://auth.example.com
                    grant: client_credentials
                    client:
                      id: ${ .clientId }
                      secret: ${ .clientSecret }
  - mergeResults:
      set:
        catalogue: ${ .catalogue }
        processed: ${ .processed }
        data: ${ .data }
