#
# One fork per shape the panel has to handle:
#  - notifyChannels: `compete` unset, so the switch reads off (the schema default)
#  - raiseAlarm:     `compete: true`, with a fork nested among its branches
#  - escalate:       the shared task fields set (`if`, `timeout`, `then`) beside the branches
document:
  dsl: "1.0.3"
  namespace: examples
  name: fork-task-shapes
  version: "0.1.0"
do:
  - notifyChannels:
      fork:
        branches:
          - sendEmail:
              call: http
              with:
                method: post
                endpoint: https://mail.example.com/api/send
          - sendSms:
              call: http
              with:
                method: post
                endpoint: https://sms.example.com/api/send
  - raiseAlarm:
      fork:
        compete: true
        branches:
          - notifyStaff:
              fork:
                branches:
                  - callNurse:
                      call: http
                      with:
                        method: put
                        endpoint: https://hospital.example.com/api/nurses
                  - callDoctor:
                      call: http
                      with:
                        method: put
                        endpoint: https://hospital.example.com/api/doctors
          - logAlarm:
              set:
                alarmRaised: true
  - escalate:
      if: ${ .severity == "critical" }
      timeout:
        after: PT5M
      fork:
        branches:
          - pageOnCall:
              call: http
              with:
                method: post
                endpoint: https://pager.example.com/api/page
          - openIncident:
              set:
                incidentOpen: true
      then: end
