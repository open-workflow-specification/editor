#
# Nested editing focus: open map (set task) inside a for loop container.
# The editor must handle adding/removing arbitrary keys in the set map
# while navigating into the for loop's nested do block — two nesting levels.
document:
  dsl: "1.0.3"
  namespace: examples
  name: set-open-map
  version: "0.1.0"
do:
  - initContext:
      set:
        requestedAt: ${ now }
        environment: production
        featureFlags:
          betaEditor: true
          darkMode: false
  - processItems:
      for:
        each: item
        in: ${ .items }
        at: index
      do:
        - enrichItem:
            set:
              id: ${ .item.id }
              label: ${ .item.name }
              index: ${ .index }
              processedAt: ${ now }
              meta:
                source: workflow
                version: v2
        - tagItem:
            set:
              tagged: true
              taggedBy: ${ $workflow.definition.document.name }
              taggedAt: ${ now }
  - finalise:
      set:
        completedAt: ${ now }
        status: done
