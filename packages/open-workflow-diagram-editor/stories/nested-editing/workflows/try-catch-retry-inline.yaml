#
# Exercises the full inline retryPolicy shape inside catch.retry so that:
#  - catch.retry is an inline object (not a named reference)
#  - catch.retry.backoff is present with a concrete variant (exponential)
#  - catch.retry.delay, limit, and jitter are all populated
#  - catch.retry.when and catch.retry.exceptWhen are present
document:
  dsl: "1.0.3"
  namespace: examples
  name: try-catch-retry-inline
  version: "0.1.0"
do:
  - tryGetPet:
      try:
        - getPet:
            call: http
            with:
              method: get
              endpoint: https://petstore.swagger.io/v2/pet/{petId}
      catch:
        errors:
          with:
            type: https://open-workflow-specification.org/spec/1.0.0/errors/communication
            status: 503
        as: error
        when: ${ $error.status == 503 }
        exceptWhen: ${ $error.status == 404 }
        retry:
          when: ${ $attempt.count < 5 }
          exceptWhen: ${ $error.status == 401 }
          delay:
            seconds: 2
          backoff:
            exponential:
              rate: 2.0
              max:
                seconds: 30
          limit:
            attempt:
              count: 5
              duration:
                seconds: 30
            duration:
              minutes: 5
          jitter:
            from:
              milliseconds: 100
            to:
              milliseconds: 500
        do:
          - logError:
              set:
                lastError: ${ $error }
