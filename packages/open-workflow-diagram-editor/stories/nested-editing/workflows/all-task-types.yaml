document:
  dsl: "1.0.3"
  namespace: examples
  name: all-task-types
  version: "0.1.0"
use:
  errors:
    notFound:
      type: https://example.com/errors/not-found
      status: 404
      title: Resource Not Found
do:
  - callHttpTask:
      call: http
      with:
        method: get
        endpoint: https://api.example.com/users
        headers:
          Accept: application/json
          X-Api-Key: ${ .apiKey }
        query:
          page: "1"
          limit: "20"
  - setContextTask:
      set:
        userId: ${ .users[0].id }
        userName: ${ .users[0].name }
        fetchedAt: ${ now }
        meta:
          source: api.example.com
          version: v2
  - runScriptTask:
      run:
        script:
          language: javascript
          arguments:
            - --user-id
            - ${ .userId }
          environment:
            NODE_ENV: production
          code: |
            const [,, flag, id] = process.argv;
            console.log(JSON.stringify({ processed: id }));
  - waitTask:
      wait:
        seconds: 5
  - forkTask:
      fork:
        compete: false
        branches:
          - notifyEmail:
              call: http
              with:
                method: post
                endpoint: https://api.example.com/notifications/email
                body:
                  userId: ${ .userId }
          - notifySlack:
              call: http
              with:
                method: post
                endpoint: https://api.example.com/notifications/slack
                body:
                  userId: ${ .userId }
  - listenTask:
      listen:
        to:
          any:
            - with:
                type: com.example.user.verified
              correlate:
                userId:
                  from: .subject
            - with:
                type: com.example.user.rejected
              correlate:
                userId:
                  from: .subject
  - emitTask:
      emit:
        event:
          with:
            source: https://api.example.com
            type: com.example.user.processed.v1
            data:
              userId: ${ .userId }
              userName: ${ .userName }
  - forTask:
      for:
        each: role
        in: ${ .roles }
        at: index
      do:
        - assignRole:
            call: http
            with:
              method: post
              endpoint: https://api.example.com/users/${ .userId }/roles
              body:
                role: ${ .role }
  - tryTask:
      try:
        - fetchPreferences:
            call: http
            with:
              method: get
              endpoint: https://api.example.com/users/${ .userId }/preferences
      catch:
        errors:
          with:
            type: https://open-workflow-specification.org/spec/1.0.0/errors/communication
            status: 404
        as: error
        do:
          - setDefaultPreferences:
              set:
                preferences:
                  theme: default
                  language: en
  - switchTask:
      switch:
        - verified:
            when: ${ .eventType == "com.example.user.verified" }
            then: doNestedTask
        - rejected:
            when: ${ .eventType == "com.example.user.rejected" }
            then: raiseErrorTask
        - default:
            then: raiseErrorTask
  - doNestedTask:
      do:
        - enrichProfile:
            call: http
            with:
              method: get
              endpoint: https://api.example.com/profile/${ .userId }
        - storeProfile:
            set:
              profile: ${ .body }
              enrichedAt: ${ now }
      then: exit
  - raiseErrorTask:
      raise:
        error: notFound
