<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Text Editor — Web Component Example</title>
    <style>
      body {
        height: 100vh;
        margin: 0;
        display: flex;
        flex-direction: column;
      }

      h1 {
        margin: 16px;
        font-size: 1.25rem;
        font-weight: 600;
        text-align: center;
      }

      openworkflowspec-text-editor {
        display: block;
        width: 80%;
        height: 80vh;
        border: 1px solid black;
        border-radius: 8px;
        overflow: hidden;
        margin: auto;
      }
    </style>
  </head>
<body>
  <h1>Text Editor — Web Component Example</h1>
  <openworkflowspec-text-editor></openworkflowspec-text-editor>

  <script type="module">
    import "./src/index.ts";
    import EditorWorker from "@openworkflowspec/text-editor/editor-worker?worker";
    import LanguageServiceWorker from "@openworkflowspec/text-editor/worker?worker";
    import { sampleWorkflow } from "./src/sample-workflow.ts";

    self.MonacoEnvironment = {
      getWorker(_workerId, label) {
        if (label === "editorWorkerService") {
          return new EditorWorker();
        }
        throw new Error(`Unexpected Monaco worker: ${label}`);
      },
    };

    const editor = document.querySelector("openworkflowspec-text-editor");
    editor.createLanguageServiceWorker = () => new LanguageServiceWorker();
    editor.content = sampleWorkflow;

    editor.addEventListener("change", (e) => {
      console.log("Workflow content changed:", e.detail.content);
    });
  </script>
</body>
</html>
